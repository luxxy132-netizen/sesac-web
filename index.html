<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 아파트 실거래 대시보드</title>
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body class="dashboard">
  <main>
    <header class="page-header">
      <div class="page-header-text">
        <span class="eyebrow">DASHBOARD</span>
        <h1>서울 아파트 실거래 대시보드</h1>
        <p class="lead">최근 12개월(2025-07 ~ 2026-06) 실거래 32만 건을 구·거래유형별로 살펴보세요.</p>
      </div>
      <nav class="top-nav" aria-label="보조 메뉴">
        <a href="about.html">한수정 소개 →</a>
      </nav>
    </header>

    <p id="errorBanner" class="error-state card" hidden></p>

    <section class="card controls-card" aria-label="필터">
      <div class="control-group">
        <label for="guSelect">자치구</label>
        <select id="guSelect" class="gu-select" aria-label="자치구 선택"></select>
      </div>
      <div class="control-group">
        <span id="dealTypeLabel">거래유형</span>
        <div id="dealTypeTabs" class="tabs" role="tablist" aria-labelledby="dealTypeLabel"></div>
      </div>
    </section>

    <p id="provisionalNote" class="caption kpi-caveat" role="note"></p>

    <section class="kpi-row" id="kpiRow" aria-label="시장 요약 KPI"></section>

    <div class="content-grid">
      <section class="card chart-card" aria-label="추이 차트">
        <div class="chart-toolbar">
          <div class="section-header" style="margin-bottom:0;">
            <h1 style="font-size:1.25rem;line-height:1.75rem;">추이 <span id="selectionSummary" class="caption"></span></h1>
          </div>
          <div class="control-group" style="gap:4px;">
            <span id="metricToggleLabel" class="caption">지표</span>
            <div id="metricToggle" class="metric-toggle" role="group" aria-labelledby="metricToggleLabel"></div>
          </div>
        </div>
        <div class="chart-wrap">
          <div class="chart-scroll" id="chartSvgWrap"></div>
          <div class="chart-tooltip" id="chartTooltip" role="status" aria-live="polite"></div>
        </div>
        <div class="chart-legend">
          <span><span class="swatch" style="background:var(--color-primary-normal)"></span>선택 지표 (선)</span>
          <span><span class="swatch" style="background:var(--color-primary-bg)"></span>거래량 (막대, 보조축)</span>
          <span><span class="swatch swatch-dashed"></span>최근월 잠정치 (신고 지연 가능)</span>
        </div>
      </section>

      <section class="card ranking-card" aria-label="구별 랭킹">
        <div class="section-header">
          <h1 style="font-size:1.25rem;line-height:1.75rem;">구별 랭킹</h1>
          <span class="caption">헤더 클릭으로 정렬 · 행 클릭으로 구 선택</span>
        </div>
        <div class="table-scroll" id="rankingTableWrap"></div>
      </section>
    </div>

    <section class="card search-card" aria-label="단지명 검색">
      <div class="section-header">
        <h1 style="font-size:1.25rem;line-height:1.75rem;">단지명 검색</h1>
        <span class="caption">8,216개 단지</span>
      </div>
      <label for="complexSearch" class="visually-hidden">단지명 검색</label>
      <input id="complexSearch" class="search-input" type="text" placeholder="단지명을 입력하세요 (예: 자이, 푸르지오)" autocomplete="off">
      <p id="searchStatus" class="search-status" aria-live="polite"></p>
      <div id="searchResults" class="search-results"></div>
    </section>
  </main>
  <script src="assets/dashboard.js"></script>
</body>
</html>
